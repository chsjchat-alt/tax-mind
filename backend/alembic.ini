# A generic single-database configuration for async SQLAlchemy

[alembic]
# path to migration scripts
script_location = alembic

# sys.path prepend
prepend_sys_path = .

# version location
version_locations = alembic/versions

# sqlalchemy.url is overridden by env.py (async engine, from DATABASE_URL env var)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
