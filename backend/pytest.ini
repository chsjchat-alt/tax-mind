[pytest]
testpaths = tests
asyncio_mode = auto

# 覆盖率只针对三个核心引擎模块（tax_risk_engine / ssf_analyzer /
# compliance_checker），生成终端与 htmlcov 两种报告。
addopts =
    --cov=app.core.tax_risk_engine
    --cov=app.core.ssf_analyzer
    --cov=app.core.compliance_checker
    --cov-report=term-missing
    --cov-report=html
