[pytest]
testpaths = tests
asyncio_mode = auto

# 基线说明：
#   - tests/test_simulation_engine.py 导入不存在的 PENALTY_MULTIPLIERS，
#     属存量问题（与本次改动无关），为避免 collection error 中断整个测试
#     流程，统一忽略该文件。修复后应移除 --ignore。
#   - 覆盖率只针对三个核心引擎模块（tax_risk_engine / ssf_analyzer /
#     compliance_checker），生成终端与 htmlcov 两种报告。
addopts =
    --ignore=tests/test_simulation_engine.py
    --cov=app.core.tax_risk_engine
    --cov=app.core.ssf_analyzer
    --cov=app.core.compliance_checker
    --cov-report=term-missing
    --cov-report=html
