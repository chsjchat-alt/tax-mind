# ═══════════════════════════════════════════════════════
#  税智·心判 Nginx 安全网关配置
#  等保2.0 三级 | TLS 1.3 | DDoS Rate Limiting
# ═══════════════════════════════════════════════════════

# ── 上游服务 ──
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

# ── DDoS 防护：全局连接数限制 ──
# 单个客户端 IP 最大并发连接数
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# 单个客户端 IP 请求速率限制（10 req/s，burst 20）
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
# API 接口速率限制（更严格：5 req/s）
limit_req_zone $binary_remote_addr zone=api_req_per_ip:10m rate=5r/s;
# 登录/敏感接口速率限制（1 req/s，防暴力破解）
limit_req_zone $binary_remote_addr zone=login_req_per_ip:10m rate=1r/s;

# ── 连接数上限 ──
worker_connections 1024;
worker_rlimit_nofile 65535;

# HTTP → HTTPS 强制跳转 + 公网入口
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── ACME 证书验证路径（Let's Encrypt） ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── 其余请求强制 301 跳转 HTTPS ──
    location / {
        return 301 https://$host$request_uri;
    }

    # ── 健康检查端点（不跳转） ──
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

# ═══════════════════════════════════════════════════════
#  HTTPS 主服务（TLS 1.3 严格加密）
# ═══════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── TLS 证书（生产环境替换为正式证书） ──
    # 部署前执行: certbot --nginx -d your-domain.com
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── TLS 1.3 强制配置 ──
    ssl_protocols TLSv1.2 TLSv1.3;   # 允许 TLS 1.2（兼容性），TLS 1.0/1.1 完全禁用
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # ── DH 参数 ──
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ── SSL 会话缓存 ──
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── OCSP Stapling ──
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── 安全头 ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self';" always;

    # ── 通用请求体大小限制（防大包 DDoS） ──
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ── 超时设置（防慢速攻击） ──
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    root /usr/share/nginx/html;
    index index.html;

    # ── 全局 DDoS 防护 ──
    limit_conn conn_per_ip 20;
    limit_req zone=req_per_ip burst=20 nodelay;

    # ═══════════════════════════════════════════════════
    #  API 代理（后端 FastAPI）
    # ═══════════════════════════════════════════════════
    location /api/ {
        # API 层更严格的速率限制
        limit_req zone=api_req_per_ip burst=10 nodelay;
        limit_conn conn_per_ip 10;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # ── 代理头（保留客户端真实 IP） ──
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # ── 连接保持 ──
        proxy_set_header Connection "";

        # ── 超时（LLM 调用可能较长） ──
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # ── 缓冲 ──
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;

        # ── 隐藏后端服务器信息 ──
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ═══════════════════════════════════════════════════
    #  敏感接口限流（防暴力破解/业务逻辑攻击）
    # ═══════════════════════════════════════════════════
    location /api/v1/auth/ {
        limit_req zone=login_req_per_ip burst=3 nodelay;
        limit_conn conn_per_ip 5;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ═══════════════════════════════════════════════════
    #  SPA 路由支持
    # ═══════════════════════════════════════════════════
    location / {
        limit_conn conn_per_ip 10;
        try_files $uri $uri/ /index.html;

        # ── 静态资源缓存策略 ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }
    }

    # ── 健康检查 ──
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── 隐藏 Nginx 版本号 ──
    server_tokens off;

    # ── 访问日志（包含真实客户端 IP） ──
    log_format security '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '"$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log security;
    error_log /var/log/nginx/error.log warn;
}
