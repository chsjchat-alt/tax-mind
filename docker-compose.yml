﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿# ══════════════════════════════════════════════════════════════════
#  税智·心判 — 生产级 Docker 编排栈
#  等保2.0 三级 | TLS 1.3 | DDoS Rate Limiting | AES-256
# ══════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 15 数据库 ──────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: taxmind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxmind}
      POSTGRES_USER: ${POSTGRES_USER:-taxmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}  # 必须通过环境变量注入
      # 安全加固：禁用不必要功能
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taxmind-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxmind} -d ${POSTGRES_DB:-taxmind}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # 不暴露端口到宿主机（仅内部网络可访问，零信任原则）
    expose:
      - "5432"

  # ── FastAPI 后端微服务 ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxmind-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-taxmind}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-taxmind}
      - APP_NAME=税智·心判
      - APP_VERSION=${APP_VERSION:-0.3.0}
      - DEBUG=false
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - LLM_TIMEOUT=30
      - LLM_MAX_RETRIES=3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxmind-net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      replicas: 2  # 仅在 docker stack deploy (Swarm) 模式下生效
    # 安全加固：只读根文件系统（确认后端无运行时写文件操作），禁止提权
    read_only: true
    security_opt:
      - no-new-privileges:true
    # 注: driver_opts encrypted 仅在 Docker Swarm overlay 网络生效
    # 生产环境建议启用 PostgreSQL sslmode=require 应用层加密

  # ── Nginx 反代 + React 静态产物（TLS 终结） ──────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxmind-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taxmind-net
    ports:
      # 公网入口（仅 Nginx 暴露）
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    # 安全加固
    read_only: false  # Nginx 需要写临时文件
    security_opt:
      - no-new-privileges:true

# ── 网络 ────────────────────────────────────────────
networks:
  taxmind-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
    # 启用加密（仅 Swarm 模式支持）
    driver_opts:
      encrypted: "true"

# ── 持久化卷 ────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  backup_data:
    driver: local

# ══════════════════════════════════════════════════════════════════
